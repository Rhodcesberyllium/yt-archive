# fetch-youtube-cloud — 每周自动 + 手动触发，在美国节点直连 YouTube 全量抓取并写回仓库。
name: fetch-youtube-cloud

on:
  workflow_dispatch:           # 你在 Actions 页点 "Run workflow" 可随时手动跑一次
  schedule:
    - cron: "0 10 * * 1"       # 每周一 10:00 UTC = 北京 18:00
  push:
    branches: [ main ]
    paths:                     # 只有代码改动才自动跑（上传/改脚本时会触发一次）
      - 'fetch.py'
      - 'verify_output.py'
      - '.github/workflows/fetch.yml'

concurrency:
  group: fetch-cloud
  cancel-in-progress: false    # 上次没跑完就不开新run，避免写回冲突

permissions:
  contents: write              # 允许把结果文件提交回仓库

env:
  # 想换频道：仓库 Settings -> Secrets and variables -> Actions -> Variables
  # 添加 CHANNEL_URL 即可覆盖默认值（无需改代码）。
  CHANNEL_URL: ${{ vars.CHANNEL_URL || 'https://www.youtube.com/@NurdRage/videos' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet yt-dlp

      - name: 云端全量抓取（美国节点直连）
        run: python fetch.py "$CHANNEL_URL"

      - name: 验收自检（verify_output.py）
        run: |
          OUT=$(ls data/*_videos.txt 2>/dev/null | head -n1)
          if [ -z "$OUT" ]; then echo "未找到输出文件"; exit 1; fi
          echo "校验文件: $OUT"
          python verify_output.py "$OUT"

      - name: 上传产物（备用下载通道）
        uses: actions/upload-artifact@v4
        with:
          name: videos-txt
          path: data/*.txt

      - name: 把最新清单提交回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 刷新视频清单 [skip ci]'
          file_pattern: 'data/*.txt'
          disable_globbing: true
